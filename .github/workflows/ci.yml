# CI：main 分支 push / PR 自动验证
#   backend  —— pytest 全量（MySQL 服务容器 + 三段 SQL 灌库）→ RAG 索引重建 + 评测(--fail-under) → 路由评测
#   frontend —— npm ci + next build
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: demo123
          MYSQL_DATABASE: ai_agent_commerce_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdemo123"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30

    env:
      # 业务库连接（pytest 与 RAG 评测的 knowledge_search 审计写库均依赖）
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: demo123
      MYSQL_DATABASE: ai_agent_commerce_demo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖
        # torch 先从 CPU 索引安装（与 Dockerfile/本机一致）：Linux PyPI 默认 torch 拉全套 CUDA 依赖
        # （+2.5GB 下载），且 CUDA 构建与本机 CPU 构建的 embedding 数值存在漂移——曾致
        # 无答案用例「怎么申请营业执照」未被过滤（无答案过滤率 66.67%，CI 失败）
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt

      - name: 等待 MySQL 就绪并导入 schema/种子/演示数据
        # 顺序与 docker-compose.yml 首启一致：schema(建库建表) → 种子用户(demo 数据依赖"最新已存在用户")
        # → 演示数据(orders 等)。schema.sql 自带 CREATE DATABASE IF NOT EXISTS / USE，直接以 root 灌入即可。
        run: |
          for i in $(seq 1 30); do
            mysql -h 127.0.0.1 -P 3306 -uroot -pdemo123 -e "SELECT 1" >/dev/null 2>&1 && break
            echo "等待 MySQL 就绪 ($i/30)"; sleep 2
          done
          mysql -h 127.0.0.1 -P 3306 -uroot -pdemo123 < backend/database/schema.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -pdemo123 < backend/database/docker_seed_users.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -pdemo123 < backend/database/demo_minimal_cn.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -pdemo123 -e "USE ai_agent_commerce_demo; SELECT COUNT(*) AS orders FROM orders;"

      - name: pytest 全量（不加载 embedding 模型）
        # 与 tests/conftest.py 的强制约束一致（显式设置防意外联网）；
        # 向量库相关测试用 tmp_path + fake provider，不依赖现成索引
        env:
          EMBEDDING_WARMUP: "false"
          HF_HUB_OFFLINE: "1"
        run: cd backend && python -m pytest tests/ -q

      - name: 重建 RAG 向量索引（真实 BGE embedding）
        # 此步需要联网下载 BAAI/bge-small-zh-v1.5（约 90MB，runner 直连 HF），
        # 故不设 HF_HUB_OFFLINE；约 20-30 秒（CPU）。
        # OMP 固定单线程：不同 runner 的线程归约顺序会造成 embedding 数值微漂移，
        # 使临界用例（如无答案用例28）在 coverage/relevance 两种补检策略间翻转。
        env:
          OMP_NUM_THREADS: "1"
        run: cd backend && python rebuild_rag_index.py --force

      - name: RAG 评测（top1 ≥ 0.8 且无答案过滤率 100%，否则非零退出）
        env:
          OMP_NUM_THREADS: "1"
        run: cd backend && python -m evaluation.run_rag_eval --fail-under 0.8

      - name: 路由评测（离线模式，规则层独立作答）
        run: cd backend && python -m evaluation.run_eval

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci + next build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: cd frontend && npm ci && npm run build
