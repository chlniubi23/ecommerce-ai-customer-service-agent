# 一键全栈：MySQL 8 + FastAPI 后端 + Next.js 前端
#   docker compose up -d        # 首启自动：建库 + 导入演示数据 + 重建 RAG 向量索引
#   docker compose down         # 停止（数据保留在命名卷）
#
# 前置：backend/.env 存在（可从 backend/.env.example 复制，填 OPENAI_API_KEY；
# MYSQL_* 会被下方 environment 覆盖，无需与容器一致）。

services:
  db:
    image: mysql:8
    container_name: ecom-agent-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-demo123}
      MYSQL_DATABASE: ai_agent_commerce_demo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # /docker-entrypoint-initdb.d/ 仅在数据卷为空时执行（首启）；
      # 文件名字典序即执行顺序：01 建表 → 02 种子用户（demo_minimal_cn.sql 引用
      # "最新已存在用户"，不自带用户创建，空库直接跑 03 会因 user_id 为 NULL 失败）
      # → 03 演示数据（原文件名字典序在 schema.sql 之前，故挂载时统一重命名）
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/docker_seed_users.sql:/docker-entrypoint-initdb.d/02-seed-users.sql:ro
      - ./backend/database/demo_minimal_cn.sql:/docker-entrypoint-initdb.d/03-demo.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        # Embedding 双变体：true=本地 BGE（默认）；服务器（2核2G）部署改 false（见下方注释块）
        EMBEDDING_PRELOAD: "true"
        HF_ENDPOINT: https://hf-mirror.com
    container_name: ecom-agent-backend
    env_file:
      # backend/.env 提供 OPENAI_* 等真实配置（仅运行时注入，不进镜像层）。
      # 无该文件也可启动（LLM 功能不可用，其余正常）。
      - path: backend/.env
        required: false
    environment:
      # 以下覆盖 env_file，指向 compose 内服务（环境变量优先级高于 .env 文件）
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-demo123}
      MYSQL_DATABASE: ai_agent_commerce_demo
    volumes:
      # qdrant 向量库持久化：命名卷，容器内从零构建（宿主开发目录的 vector_store 不挂载）
      - qdrant_data:/app/vector_store/qdrant
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # ── 服务器（2核2G）slim 部署示例 ─────────────────────────────
    # build.args.EMBEDDING_PRELOAD 改为 "false"（跳过 torch/模型，镜像 ~500MB），
    # 并在 environment 增加（embedding 走 OpenAI 兼容 API；dim 必须与所选 API 一致，
    # 向量索引为空时启动脚本会自动用该 provider 重建）：
    #   EMBEDDING_PROVIDER: openai
    #   EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
    #   EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
    #   EMBEDDING_MODEL: text-embedding-3-small
    #   EMBEDDING_DIM: "1536"
    # ─────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      args:
        # 本机访问默认值；服务器部署改为 http://<服务器IP>:8000
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: ecom-agent-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  qdrant_data:
