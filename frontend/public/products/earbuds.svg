<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="60%" stop-color="#dce8fb"/>
      <stop offset="100%" stop-color="#c7d8f2"/>
    </radialGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a4256"/>
      <stop offset="100%" stop-color="#12151f"/>
    </linearGradient>
    <linearGradient id="bud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#c3ccdb"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f6bff"/>
      <stop offset="100%" stop-color="#5b8bff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="600" rx="210" ry="38" fill="#0b1120" opacity="0.10"/>
  <!-- charging case -->
  <g transform="translate(400 470)">
    <rect x="-150" y="-96" width="300" height="192" rx="46" fill="url(#case)" stroke="#ffffff" stroke-width="5"/>
    <rect x="-150" y="-96" width="300" height="70" rx="46" fill="#ffffff" opacity="0.08"/>
    <circle cx="0" cy="70" r="6" fill="#7fd0ff"/>
    <ellipse cx="-70" cy="-40" rx="52" ry="34" fill="#0b0e16"/>
    <ellipse cx="70" cy="-40" rx="52" ry="34" fill="#0b0e16"/>
  </g>
  <!-- left bud out -->
  <g transform="translate(268 300) rotate(-18)">
    <circle cx="0" cy="0" r="52" fill="url(#bud)" stroke="#fff" stroke-width="4"/>
    <circle cx="0" cy="0" r="22" fill="#2a3346"/>
    <rect x="-16" y="40" width="32" height="120" rx="16" fill="url(#bud)" stroke="#fff" stroke-width="4"/>
  </g>
  <!-- right bud out -->
  <g transform="translate(532 300) rotate(18)">
    <circle cx="0" cy="0" r="52" fill="url(#bud)" stroke="#fff" stroke-width="4"/>
    <circle cx="0" cy="0" r="22" fill="#2a3346"/>
    <rect x="-16" y="40" width="32" height="120" rx="16" fill="url(#bud)" stroke="#fff" stroke-width="4"/>
  </g>
  <g transform="translate(96 96)">
    <rect x="0" y="0" width="150" height="46" rx="23" fill="url(#wall)"/>
    <text x="75" y="30" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="800" fill="#fff">主动降噪</text>
  </g>
</svg>
