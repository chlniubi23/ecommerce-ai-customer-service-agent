<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="60%" stop-color="#dce8fb"/>
      <stop offset="100%" stop-color="#c7d8f2"/>
    </radialGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a4256"/>
      <stop offset="100%" stop-color="#12151f"/>
    </linearGradient>
    <linearGradient id="grille" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a93a6"/>
      <stop offset="100%" stop-color="#4b5566"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f6bff"/>
      <stop offset="100%" stop-color="#5b8bff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="672" rx="180" ry="30" fill="#0b1120" opacity="0.10"/>
  <!-- stand base -->
  <rect x="300" y="628" width="200" height="26" rx="13" fill="url(#mic)"/>
  <rect x="388" y="470" width="24" height="170" rx="12" fill="url(#mic)"/>
  <!-- arm -->
  <rect x="300" y="360" width="200" height="20" rx="10" fill="url(#mic)" transform="rotate(-14 400 370)"/>
  <!-- mic body -->
  <g transform="translate(400 250)">
    <rect x="-78" y="-118" width="156" height="300" rx="78" fill="url(#mic)" stroke="#fff" stroke-width="5"/>
    <rect x="-58" y="-104" width="116" height="150" rx="58" fill="url(#grille)"/>
    <g stroke="#12151f" stroke-width="4" opacity="0.55">
      <line x1="-58" y1="-70" x2="58" y2="-70"/>
      <line x1="-58" y1="-44" x2="58" y2="-44"/>
      <line x1="-58" y1="-18" x2="58" y2="-18"/>
      <line x1="-58" y1="8" x2="58" y2="8"/>
    </g>
    <circle cx="0" cy="110" r="12" fill="#7fd0ff"/>
    <rect x="-40" y="140" width="80" height="10" rx="5" fill="#5b8bff" opacity="0.7"/>
  </g>
  <g transform="translate(96 96)">
    <rect x="0" y="0" width="164" height="46" rx="23" fill="url(#wall)"/>
    <text x="82" y="30" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="800" fill="#fff">直播麦克风</text>
  </g>
</svg>
