<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#e8f6ff"/>
      <stop offset="60%" stop-color="#d0ebf9"/>
      <stop offset="100%" stop-color="#b8ddf2"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4faff"/>
      <stop offset="100%" stop-color="#ccdde8"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8c4d4"/>
      <stop offset="100%" stop-color="#7fa8be"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f0f9"/>
      <stop offset="100%" stop-color="#b0cfe0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00c2e0"/>
      <stop offset="100%" stop-color="#0099bb"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077a8"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0a2a3a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- floor shadow -->
  <ellipse cx="400" cy="700" rx="160" ry="32" fill="#0a2a3a" opacity="0.10"/>

  <!-- main purifier body group -->
  <g filter="url(#shadow)">
    <!-- back/side face -->
    <rect x="310" y="200" width="90" height="460" rx="12" fill="url(#side)"/>
    <!-- front face -->
    <rect x="270" y="185" width="220" height="470" rx="28" fill="url(#body)" stroke="#d4eaf5" stroke-width="2"/>

    <!-- air intake grille lines (front) -->
    <g stroke="#b8d4e4" stroke-width="2.5" opacity="0.7">
      <line x1="300" y1="280" x2="460" y2="280"/>
      <line x1="300" y1="296" x2="460" y2="296"/>
      <line x1="300" y1="312" x2="460" y2="312"/>
      <line x1="300" y1="328" x2="460" y2="328"/>
      <line x1="300" y1="344" x2="460" y2="344"/>
      <line x1="300" y1="360" x2="460" y2="360"/>
      <line x1="300" y1="376" x2="460" y2="376"/>
      <line x1="300" y1="392" x2="460" y2="392"/>
      <line x1="300" y1="408" x2="460" y2="408"/>
      <line x1="300" y1="424" x2="460" y2="424"/>
      <line x1="300" y1="440" x2="460" y2="440"/>
      <line x1="300" y1="456" x2="460" y2="456"/>
      <line x1="300" y1="472" x2="460" y2="472"/>
      <line x1="300" y1="488" x2="460" y2="488"/>
      <line x1="300" y1="504" x2="460" y2="504"/>
      <line x1="300" y1="520" x2="460" y2="520"/>
    </g>

    <!-- top outlet cap -->
    <rect x="285" y="185" width="190" height="52" rx="22" fill="url(#top)"/>
    <!-- outlet slits -->
    <g stroke="#9ab8cc" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <line x1="330" y1="198" x2="330" y2="228"/>
      <line x1="350" y1="196" x2="350" y2="230"/>
      <line x1="370" y1="195" x2="370" y2="231"/>
      <line x1="390" y1="195" x2="390" y2="231"/>
      <line x1="410" y1="196" x2="410" y2="230"/>
      <line x1="430" y1="198" x2="430" y2="228"/>
    </g>

    <!-- cyan accent ring -->
    <rect x="270" y="545" width="220" height="14" rx="7" fill="url(#ring)" opacity="0.9"/>

    <!-- control panel area -->
    <rect x="330" y="568" width="100" height="62" rx="14" fill="#e4f2fa" stroke="#c0daea" stroke-width="1.5"/>
    <!-- power button -->
    <circle cx="380" cy="590" r="14" fill="url(#ring)" opacity="0.9"/>
    <path d="M 380 580 L 380 586" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 372 583 A 10 10 0 1 0 388 583" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- mode indicator dots -->
    <circle cx="356" cy="614" r="4" fill="#00c2e0" opacity="0.9"/>
    <circle cx="370" cy="614" r="4" fill="#00c2e0" opacity="0.5"/>
    <circle cx="384" cy="614" r="4" fill="#00c2e0" opacity="0.3"/>
    <circle cx="398" cy="614" r="4" fill="#c8dce7" opacity="0.6"/>

    <!-- AQI display -->
    <rect x="298" y="568" width="28" height="62" rx="10" fill="#1a3a4a" opacity="0.85"/>
    <text x="312" y="594" text-anchor="middle" font-family="Segoe UI, monospace" font-size="13" font-weight="900" fill="#00e5ff">12</text>
    <text x="312" y="612" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" fill="#00c2e0">AQI</text>
    <text x="312" y="624" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="7" fill="#4fc3f7">优</text>
  </g>

  <!-- floating air particles (clean air effect) -->
  <g opacity="0.55">
    <circle cx="220" cy="260" r="5" fill="#00c2e0"/>
    <circle cx="198" cy="310" r="3.5" fill="#48cae4"/>
    <circle cx="230" cy="355" r="4" fill="#00b4d8"/>
    <circle cx="205" cy="400" r="3" fill="#0096c7"/>
    <circle cx="225" cy="445" r="5" fill="#00c2e0"/>
    <circle cx="570" cy="275" r="4" fill="#00c2e0"/>
    <circle cx="590" cy="330" r="3" fill="#48cae4"/>
    <circle cx="565" cy="380" r="5" fill="#00b4d8"/>
    <circle cx="585" cy="430" r="3.5" fill="#0096c7"/>
  </g>
  <!-- air flow arcs -->
  <g stroke="#00c2e0" stroke-width="2" fill="none" opacity="0.35" stroke-linecap="round">
    <path d="M 218 300 Q 180 290 185 260"/>
    <path d="M 212 350 Q 170 340 175 310"/>
    <path d="M 576 320 Q 614 310 609 280"/>
    <path d="M 570 370 Q 608 360 604 330"/>
  </g>

  <!-- brand label -->
  <g transform="translate(96 96)">
    <rect x="0" y="0" width="192" height="46" rx="23" fill="url(#label)"/>
    <text x="96" y="30" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#fff">极净 Pro</text>
  </g>
</svg>
