<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="60%" stop-color="#12121f"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a3e"/>
      <stop offset="100%" stop-color="#1a1a28"/>
    </linearGradient>
    <linearGradient id="keycap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a50"/>
      <stop offset="100%" stop-color="#252535"/>
    </linearGradient>
    <linearGradient id="keycap-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#464660"/>
      <stop offset="100%" stop-color="#30304a"/>
    </linearGradient>
    <linearGradient id="rgb-r" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff003c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff003c" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="rgb-g" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="rgb-b" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0088ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0088ff" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="rgb-p" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#cc00ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#cc00ff" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c00ff"/>
      <stop offset="100%" stop-color="#cc00ff"/>
    </linearGradient>
    <filter id="glow-r"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-g"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>

  <!-- dark background -->
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- desk surface reflection -->
  <ellipse cx="400" cy="720" rx="300" ry="40" fill="#6600ff" opacity="0.07"/>

  <!-- keyboard body -->
  <g filter="url(#shadow)">
    <rect x="90" y="260" width="620" height="300" rx="18" fill="#18182a" stroke="#2a2a40" stroke-width="2"/>
    <rect x="96" y="266" width="608" height="288" rx="14" fill="url(#body)"/>

    <!-- RGB underglow strip -->
    <rect x="96" y="530" width="608" height="18" rx="0" fill="url(#rgb-r)" opacity="0.6"/>
    <rect x="300" y="530" width="200" height="18" rx="0" fill="url(#rgb-g)" opacity="0.5"/>
    <rect x="450" y="530" width="200" height="18" rx="0" fill="url(#rgb-b)" opacity="0.5"/>
    <rect x="96"  y="530" width="150" height="18" rx="0" fill="url(#rgb-p)" opacity="0.5"/>
  </g>

  <!-- ── Row 1: Function keys ── -->
  <!-- ESC -->
  <rect x="112" y="282" width="38" height="34" rx="5" fill="url(#keycap-light)"/>
  <text x="131" y="304" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#ff4466">ESC</text>
  <!-- F1-F12 -->
  <g fill="url(#keycap)" stroke="#1a1a2e" stroke-width="1">
    <rect x="164" y="282" width="32" height="34" rx="5"/>
    <rect x="200" y="282" width="32" height="34" rx="5"/>
    <rect x="236" y="282" width="32" height="34" rx="5"/>
    <rect x="272" y="282" width="32" height="34" rx="5"/>
    <rect x="316" y="282" width="32" height="34" rx="5"/>
    <rect x="352" y="282" width="32" height="34" rx="5"/>
    <rect x="388" y="282" width="32" height="34" rx="5"/>
    <rect x="424" y="282" width="32" height="34" rx="5"/>
    <rect x="468" y="282" width="32" height="34" rx="5"/>
    <rect x="504" y="282" width="32" height="34" rx="5"/>
    <rect x="540" y="282" width="32" height="34" rx="5"/>
    <rect x="576" y="282" width="32" height="34" rx="5"/>
  </g>
  <!-- F-key labels with RGB colors -->
  <g font-family="Segoe UI, sans-serif" font-size="9" font-weight="600" text-anchor="middle">
    <text x="180" y="304" fill="#ff6680">F1</text>
    <text x="216" y="304" fill="#ff9944">F2</text>
    <text x="252" y="304" fill="#ffee44">F3</text>
    <text x="288" y="304" fill="#44ee44">F4</text>
    <text x="332" y="304" fill="#44ffaa">F5</text>
    <text x="368" y="304" fill="#44ccff">F6</text>
    <text x="404" y="304" fill="#4488ff">F7</text>
    <text x="440" y="304" fill="#8844ff">F8</text>
    <text x="484" y="304" fill="#cc44ff">F9</text>
    <text x="520" y="304" fill="#ff44cc">F10</text>
    <text x="556" y="304" fill="#ff44aa">F11</text>
    <text x="592" y="304" fill="#ff4466">F12</text>
  </g>
  <!-- DEL/END cluster -->
  <g fill="url(#keycap)" stroke="#1a1a2e" stroke-width="1">
    <rect x="624" y="282" width="36" height="34" rx="5"/>
    <rect x="664" y="282" width="36" height="34" rx="5"/>
  </g>
  <g font-family="Segoe UI, sans-serif" font-size="8" font-weight="600" text-anchor="middle">
    <text x="642" y="304" fill="#cc88ff">Del</text>
    <text x="682" y="304" fill="#cc88ff">End</text>
  </g>

  <!-- ── Row 2: Number row ── -->
  <!-- backtick -->
  <rect x="112" y="322" width="38" height="36" rx="5" fill="url(#keycap)" stroke="#1a1a2e" stroke-width="1"/>
  <!-- 1-0 -->
  <g fill="url(#keycap)" stroke="#1a1a2e" stroke-width="1">
    <rect x="154" y="322" width="36" height="36" rx="5"/>
    <rect x="194" y="322" width="36" height="36" rx="5"/>
    <rect x="234" y="322" width="36" height="36" rx="5"/>
    <rect x="274" y="322" width="36" height="36" rx="5"/>
    <rect x="314" y="322" width="36" height="36" rx="5"/>
    <rect x="354" y="322" width="36" height="36" rx="5"/>
    <rect x="394" y="322" width="36" height="36" rx="5"/>
    <rect x="434" y="322" width="36" height="36" rx="5"/>
    <rect x="474" y="322" width="36" height="36" rx="5"/>
    <rect x="514" y="322" width="36" height="36" rx="5"/>
    <rect x="554" y="322" width="36" height="36" rx="5"/>
    <rect x="594" y="322" width="36" height="36" rx="5"/>
  </g>
  <g font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <text x="172" y="346" fill="#ff6644">1</text>
    <text x="212" y="346" fill="#ff9933">2</text>
    <text x="252" y="346" fill="#ffdd33">3</text>
    <text x="292" y="346" fill="#33ee55">4</text>
    <text x="332" y="346" fill="#33ffaa">5</text>
    <text x="372" y="346" fill="#33ccff">6</text>
    <text x="412" y="346" fill="#3377ff">7</text>
    <text x="452" y="346" fill="#8833ff">8</text>
    <text x="492" y="346" fill="#cc33ff">9</text>
    <text x="532" y="346" fill="#ff33cc">0</text>
    <text x="572" y="346" fill="#ff3399">-</text>
    <text x="612" y="346" fill="#ff3366">=</text>
  </g>
  <!-- Backspace wide -->
  <rect x="634" y="322" width="66" height="36" rx="5" fill="url(#keycap-light)" stroke="#1a1a2e" stroke-width="1"/>
  <text x="667" y="344" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#cc88ff">⌫</text>

  <!-- ── Row 3: QWERTY ── -->
  <!-- Tab -->
  <rect x="112" y="364" width="52" height="36" rx="5" fill="url(#keycap-light)" stroke="#1a1a2e" stroke-width="1"/>
  <text x="138" y="386" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" font-weight="600" fill="#88aaff">Tab</text>
  <!-- QWERTYUIOP[] -->
  <g fill="url(#keycap)" stroke="#1a1a2e" stroke-width="1">
    <rect x="168" y="364" width="36" height="36" rx="5"/>
    <rect x="208" y="364" width="36" height="36" rx="5"/>
    <rect x="248" y="364" width="36" height="36" rx="5"/>
    <rect x="288" y="364" width="36" height="36" rx="5"/>
    <rect x="328" y="364" width="36" height="36" rx="5"/>
    <rect x="368" y="364" width="36" height="36" rx="5"/>
    <rect x="408" y="364" width="36" height="36" rx="5"/>
    <rect x="448" y="364" width="36" height="36" rx="5"/>
    <rect x="488" y="364" width="36" height="36" rx="5"/>
    <rect x="528" y="364" width="36" height="36" rx="5"/>
    <rect x="568" y="364" width="36" height="36" rx="5"/>
    <rect x="608" y="364" width="36" height="36" rx="5"/>
  </g>
  <g font-family="Segoe UI, sans-serif" font-size="13" font-weight="800" text-anchor="middle">
    <text x="186" y="387" fill="#ff5577">Q</text>
    <text x="226" y="387" fill="#ff8844">W</text>
    <text x="266" y="387" fill="#ffcc33">E</text>
    <text x="306" y="387" fill="#33ee66">R</text>
    <text x="346" y="387" fill="#33ffbb">T</text>
    <text x="386" y="387" fill="#33aaff">Y</text>
    <text x="426" y="387" fill="#4466ff">U</text>
    <text x="466" y="387" fill="#9944ff">I</text>
    <text x="506" y="387" fill="#dd44ff">O</text>
    <text x="546" y="387" fill="#ff44dd">P</text>
    <text x="586" y="387" fill="#ff4499">[ </text>
    <text x="626" y="387" fill="#ff4466">]</text>
  </g>
  <!-- Enter key (takes 2 rows) - right side wide -->
  <rect x="648" y="364" width="52" height="76" rx="5" fill="url(#keycap-light)" stroke="#1a1a2e" stroke-width="1"/>
  <text x="674" y="406" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#cc88ff">↵</text>

  <!-- ── Row 4: ASDF ── -->
  <!-- Caps Lock -->
  <rect x="112" y="406" width="58" height="34" rx="5" fill="url(#keycap-light)" stroke="#1a1a2e" stroke-width="1"/>
  <circle cx="130" cy="423" r="4" fill="#ff4444" opacity="0.8"/>
  <text x="155" y="427" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" fill="#cc88ff">Caps</text>
  <!-- ASDFGHJKL;' -->
  <g fill="url(#keycap)" stroke="#1a1a2e" stroke-width="1">
    <rect x="174" y="406" width="36" height="34" rx="5"/>
    <rect x="214" y="406" width="36" height="34" rx="5"/>
    <rect x="254" y="406" width="36" height="34" rx="5"/>
    <rect x="294" y="406" width="36" height="34" rx="5"/>
    <rect x="334" y="406" width="36" height="34" rx="5"/>
    <rect x="374" y="406" width="36" height="34" rx="5"/>
    <rect x="414" y="406" width="36" height="34" rx="5"/>
    <rect x="454" y="406" width="36" height="34" rx="5"/>
    <rect x="494" y="406" width="36" height="34" rx="5"/>
    <rect x="534" y="406" width="36" height="34" rx="5"/>
    <rect x="574" y="406" width="36" height="34" rx="5"/>
    <rect x="614" y="406" width="30" height="34" rx="5"/>
  </g>
  <g font-family="Segoe UI, sans-serif" font-size="13" font-weight="800" text-anchor="middle">
    <text x="192" y="428" fill="#ff5577">A</text>
    <text x="232" y="428" fill="#ff8844">S</text>
    <text x="272" y="428" fill="#ffcc33">D</text>
    <text x="312" y="428" fill="#33ee66">F</text>
    <text x="352" y="428" fill="#33ffbb">G</text>
    <text x="392" y="428" fill="#33aaff">H</text>
    <text x="432" y="428" fill="#4466ff">J</text>
    <text x="472" y="428" fill="#9944ff">K</text>
    <text x="512" y="428" fill="#dd44ff">L</text>
    <text x="552" y="428" fill="#ff44dd">;</text>
    <text x="592" y="428" fill="#ff4499">'</text>
    <text x="629" y="428" fill="#ff4466">\</text>
  </g>

  <!-- ── Row 5: ZXCV ── -->
  <!-- L-Shift wide -->
  <rect x="112" y="446" width="72" height="34" rx="5" fill="url(#keycap-light)" stroke="#1a1a2e" stroke-width="1"/>
  <text x="148" y="467" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#cc88ff">Shift</text>
  <!-- ZXCVBNM,./ -->
  <g fill="url(#keycap)" stroke="#1a1a2e" stroke-width="1">
    <rect x="188" y="446" width="36" height="34" rx="5"/>
    <rect x="228" y="446" width="36" height="34" rx="5"/>
    <rect x="268" y="446" width="36" height="34" rx="5"/>
    <rect x="308" y="446" width="36" height="34" rx="5"/>
    <rect x="348" y="446" width="36" height="34" rx="5"/>
    <rect x="388" y="446" width="36" height="34" rx="5"/>
    <rect x="428" y="446" width="36" height="34" rx="5"/>
    <rect x="468" y="446" width="36" height="34" rx="5"/>
    <rect x="508" y="446" width="36" height="34" rx="5"/>
    <rect x="548" y="446" width="36" height="34" rx="5"/>
  </g>
  <g font-family="Segoe UI, sans-serif" font-size="13" font-weight="800" text-anchor="middle">
    <text x="206" y="468" fill="#ff5577">Z</text>
    <text x="246" y="468" fill="#ff8844">X</text>
    <text x="286" y="468" fill="#ffcc33">C</text>
    <text x="326" y="468" fill="#33ee66">V</text>
    <text x="366" y="468" fill="#33ffbb">B</text>
    <text x="406" y="468" fill="#33aaff">N</text>
    <text x="446" y="468" fill="#4466ff">M</text>
    <text x="486" y="468" fill="#9944ff">,</text>
    <text x="526" y="468" fill="#dd44ff">.</text>
    <text x="566" y="468" fill="#ff44dd">/</text>
  </g>
  <!-- R-Shift wide -->
  <rect x="588" y="446" width="112" height="34" rx="5" fill="url(#keycap-light)" stroke="#1a1a2e" stroke-width="1"/>
  <text x="644" y="467" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#cc88ff">Shift</text>

  <!-- ── Row 6: Space bar row ── -->
  <g fill="url(#keycap-light)" stroke="#1a1a2e" stroke-width="1">
    <rect x="112" y="486" width="46" height="32" rx="5"/>
    <rect x="162" y="486" width="38" height="32" rx="5"/>
    <rect x="204" y="486" width="38" height="32" rx="5"/>
    <!-- Space bar -->
    <rect x="246" y="486" width="274" height="32" rx="5"/>
    <rect x="524" y="486" width="38" height="32" rx="5"/>
    <rect x="566" y="486" width="38" height="32" rx="5"/>
    <!-- arrows -->
    <rect x="624" y="486" width="32" height="32" rx="5"/>
    <rect x="660" y="486" width="32" height="32" rx="5"/>
    <rect x="668" y="454" width="24" height="28" rx="5"/>
  </g>
  <g font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" text-anchor="middle">
    <text x="135" y="505" fill="#cc88ff">Ctrl</text>
    <text x="181" y="505" fill="#cc88ff">Win</text>
    <text x="223" y="505" fill="#cc88ff">Alt</text>
    <text x="543" y="505" fill="#cc88ff">Alt</text>
    <text x="585" y="505" fill="#cc88ff">Fn</text>
    <text x="640" y="504" fill="#88ccff">◀</text>
    <text x="676" y="504" fill="#88ccff">▶</text>
    <text x="680" y="471" fill="#88ccff">▲</text>
  </g>

  <!-- RGB glow under keycaps (color bleeding effect) -->
  <g opacity="0.18">
    <rect x="168" y="364" width="36" height="36" rx="5" fill="#ff5577"/>
    <rect x="208" y="364" width="36" height="36" rx="5" fill="#ff8844"/>
    <rect x="248" y="364" width="36" height="36" rx="5" fill="#ffcc33"/>
    <rect x="288" y="364" width="36" height="36" rx="5" fill="#33ee66"/>
    <rect x="328" y="364" width="36" height="36" rx="5" fill="#33ffbb"/>
    <rect x="368" y="364" width="36" height="36" rx="5" fill="#33aaff"/>
    <rect x="408" y="364" width="36" height="36" rx="5" fill="#4466ff"/>
    <rect x="448" y="364" width="36" height="36" rx="5" fill="#9944ff"/>
  </g>

  <!-- brand label -->
  <g transform="translate(96 96)">
    <rect x="0" y="0" width="204" height="46" rx="23" fill="url(#label)"/>
    <text x="102" y="30" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="19" font-weight="800" fill="#fff">幻影 RGB</text>
  </g>

  <!-- floating RGB sparkles -->
  <g>
    <circle cx="160" cy="200" r="4" fill="#ff4466" opacity="0.7"/>
    <circle cx="200" cy="178" r="2.5" fill="#ff9933" opacity="0.6"/>
    <circle cx="580" cy="195" r="4" fill="#33aaff" opacity="0.7"/>
    <circle cx="620" cy="175" r="3" fill="#cc33ff" opacity="0.6"/>
    <circle cx="680" cy="210" r="2.5" fill="#33ff99" opacity="0.55"/>
    <circle cx="130" cy="230" r="3" fill="#ff44dd" opacity="0.5"/>
  </g>
</svg>
